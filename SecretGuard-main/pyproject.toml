[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secretguard"
version = "0.1.0"
description = "Enterprise-grade lightweight CLI secret scanner and pre-commit hook"
authors = [
    { name = "SecretGuard Core Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pathspec>=0.11.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "click>=8.0.0",
]

[project.scripts]
secretguard = "secretguard.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "respx>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
